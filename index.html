<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>Painel da Manhã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* TV 16:9 em três colunas: relógio e tempo | mapa de trânsito com as rotas | agenda e notícias. */
:root {
  --bg: #101820; --panel: #17222c; --line: #24323e;
  --fg: #eaf0f4; --muted: #8fa1b0;
  --accent: #f0b35c; --sky: #7fb7d9;
  --ok: #6fcf97; --warn: #f2c14e; --bad: #ef7b6b;
  /* cores das rotas, no padrão de apps de mapa */
  --r-best: #4a8cff; --r-alt: #7d93ad; --r-slow: #f5a524; --r-jam: #e5484d; --r-casing: #0b2340;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --s: clamp(12px, .92vw, 24px);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  background-image: radial-gradient(120% 60% at 15% -10%, rgba(240,179,92,.13), transparent 60%);
  font-family: var(--f-body); font-size: var(--s); line-height: 1.4;
}
.wrap {
  height: 100%; box-sizing: border-box;
  padding: calc(var(--s) * 1.5) max(16px, 2vw);
  display: grid; grid-template-columns: 1fr 1.55fr 1.15fr; gap: calc(var(--s) * 1.3);
}
.col { display: flex; flex-direction: column; gap: calc(var(--s) * 1.3); min-width: 0; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: calc(var(--s) * 1.1) calc(var(--s) * 1.3); min-width: 0; }
.label {
  font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted); font-size: calc(var(--s) * .95); margin: 0 0 calc(var(--s) * .7);
  display: flex; justify-content: space-between; align-items: baseline; gap: 1em;
}
.label small { letter-spacing: .04em; text-transform: none; font-family: var(--f-body); font-weight: 400; font-size: .85em; }
.tag { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .78em; }

.time { font-family: var(--f-display); font-weight: 600; font-size: calc(var(--s) * 7); line-height: .9; font-variant-numeric: tabular-nums; }
.date { font-size: calc(var(--s) * 1.35); color: var(--muted); margin-top: .35em; }
.updated { font-family: var(--f-mono); font-size: calc(var(--s) * .75); color: var(--muted); margin-top: .8em; }
.updated.stale { color: var(--warn); }

/* Tempo */
.day-tag { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-size: .85em; margin: 0 0 .35em; }
.temp-row { display: flex; align-items: flex-end; gap: calc(var(--s) * 1.1); flex-wrap: wrap; }
.temp-max { font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s) * 4.6); line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.temp-min { font-family: var(--f-display); font-weight: 500; font-size: calc(var(--s) * 2.4); line-height: 1; color: var(--sky); font-variant-numeric: tabular-nums; }
.temp-min span, .temp-max span { font-size: .45em; color: var(--muted); font-weight: 500; margin-left: .15em; }
.cond { font-size: calc(var(--s) * 1.25); margin: .6em 0 .8em; text-wrap: balance; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: .45em 1.2em; margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: .6em; border-bottom: 1px solid var(--line); padding-bottom: .3em; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.rainbar { height: .5em; border-radius: 99px; background: var(--line); margin-top: .9em; overflow: hidden; }
.rainbar i { display: block; height: 100%; background: var(--sky); border-radius: 99px; }
.periods { display: grid; gap: .35em; margin-top: .9em; }
.periods p { margin: 0; color: var(--muted); }
.periods b { color: var(--fg); font-weight: 600; margin-right: .4em; }
.tomorrow { margin-top: 1em; padding-top: .9em; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: .2em 1em; align-items: baseline; }
.tomorrow .day-tag { grid-column: 1 / -1; color: var(--sky); }
.tomorrow .t { font-family: var(--f-display); font-weight: 600; font-size: 2em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tomorrow .t span { color: var(--sky); }
.tomorrow p { margin: 0; min-width: 0; }
.tomorrow small { color: var(--muted); display: block; font-size: .9em; }

/* Trânsito */
.traffic { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.trip { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; flex-wrap: wrap; margin-bottom: .6em; }
.trip .route { color: var(--muted); }
.trip .route b { color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: .4em; padding: .2em .7em; border-radius: 99px; font-weight: 600; font-size: .9em; white-space: nowrap; }
.pill::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: currentColor; }
.pill.normal { color: var(--ok); background: rgba(111,207,151,.12); }
.pill.atencao { color: var(--warn); background: rgba(242,193,78,.12); }
.pill.lento { color: var(--bad); background: rgba(239,123,107,.12); }
.pill.semdados { color: var(--muted); background: rgba(143,161,176,.12); }
.map { flex: 1; min-height: 14em; border-radius: 10px; overflow: hidden; background: #0d141b; border: 1px solid var(--line); }
.map .leaflet-control-attribution { background: rgba(16,24,32,.75); color: var(--muted); font-size: 10px; }
.map .leaflet-control-attribution a { color: var(--muted); }
.rl {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  background: #f4f7fa; color: #1b2733; border-radius: 6px; padding: .15em .5em; line-height: 1.15;
  font-family: var(--f-body); font-size: calc(var(--s) * .85); box-shadow: 0 2px 8px rgba(0,0,0,.45); text-align: center;
}
.rl b { display: block; font-weight: 600; }
.rl span { font-size: .8em; color: #55697d; }
.rl.best { background: var(--r-best); color: #fff; }
.rl.best span { color: #dce8ff; }
.routes { list-style: none; margin: .7em 0 0; padding: 0; }
.routes li { display: grid; grid-template-columns: .45em 1fr auto; gap: .8em; align-items: center; padding: .5em 0; border-top: 1px solid var(--line); }
.routes li:first-child { border-top: 0; }
.routes .sw { align-self: stretch; border-radius: 99px; background: var(--r-alt); }
.routes .best .sw { background: var(--r-best); }
.routes .nm { min-width: 0; }
.routes .nm b { display: block; font-weight: 500; font-size: 1.05em; overflow-wrap: anywhere; }
.routes .nm small { color: var(--muted); }
.routes .nm small.slow { color: var(--r-slow); }
.routes .tm { text-align: right; font-variant-numeric: tabular-nums; }
.routes .tm strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 2em; line-height: 1; }
.routes .tm small { color: var(--muted); }
.routes .best .tm strong { color: var(--r-best); font-size: 2.6em; }
.routes .best .nm b::before { content: "Melhor rota"; display: block; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .72em; color: var(--accent); }
.legend { display: flex; gap: 1.1em; flex-wrap: wrap; color: var(--muted); font-size: .82em; margin-top: .5em; }
.legend i { display: inline-block; width: 1.6em; height: .35em; border-radius: 99px; vertical-align: middle; margin-right: .4em; }
.alerts { list-style: none; padding: 0; margin: .5em 0 0; display: flex; flex-direction: column; gap: .4em; }
.alerts li { border-left: 3px solid var(--warn); padding: .1em 0 .1em .7em; font-size: .92em; }

/* Agenda */
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.events li { display: grid; grid-template-columns: 4.6em 1fr; gap: .9em; padding: .55em 0; border-top: 1px solid var(--line); align-items: baseline; }
.events li:first-child { border-top: 0; padding-top: .1em; }
.events .when { font-family: var(--f-display); font-weight: 600; font-size: 1.4em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
.events .when small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .5em; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.events .what { font-size: 1.05em; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.events .where { display: block; font-size: .8em; color: var(--muted); font-weight: 400; }
.events li.past { opacity: .45; }
.events li.now .when { color: var(--ok); }
.next li { grid-template-columns: 6.4em 1fr; }
.next .when { color: var(--sky); font-size: 1.1em; }
.next .when small { font-size: .65em; }
.empty { color: var(--muted); font-size: 1.05em; margin: .2em 0; }

/* Notícias */
.newscard { flex: 1; min-height: 0; overflow: hidden; }
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news li { padding: .5em 0; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; padding-top: .1em; }
.tag.economia { color: var(--accent); }
.tag.politica { color: var(--sky); }
.tag.esportes { color: var(--ok); }
.news p { margin: .1em 0 0; font-size: .98em; text-wrap: pretty; }
.news .src { color: var(--muted); font-size: .78em; margin-left: .4em; }

@media (max-width: 900px) {
  :root { --s: 15px; }
  .wrap { grid-template-columns: 1fr; height: auto; }
  .time { font-size: 72px; }
  .map { min-height: 320px; }
}
</style>
</head>

    <section class="card next" aria-labelledby="h-prox" id="card-prox">

    <section class="card newscard" aria-labelledby="h-news">
      <h2 class="label" id="h-news">Notícias</h2>
      <ul class="news" id="noticias"></ul>

  </div>
</div>

        '<div><dt>Pôr do sol</dt><dd>' + esc(c.porDoSol) + '</dd></div>' +
      '</dl>' +
      '<div class="rainbar" aria-hidden="true"><i style="width:' + chuva + '%"></i></div>' +
      ((c.periodos || []).length ? '<div class="periods">' + c.periodos.map((x) => '<p><b>' + esc(x.nome) + '</b>' + esc(x.texto) + '</p>').join("") + '</div>' : "") +
      (a ? '<div class="tomorrow"><p class="day-tag">Amanhã' + (a.dia ? ' · ' + esc(a.dia) : '') + '</p>' +
        '<div class="t">' + esc(a.max) + '° <span>' + esc(a.min) + '°</span></div>' +
        '<p>' + esc(a.condicao) + '<small>Chuva ' + esc(a.chuvaPct) + '%' + (a.chuvaMm ? ' · ' + esc(a.chuvaMm) + ' mm' : '') + '</small></p></div>' : "");
  }

  // ---------------------------------------------------------------- agenda
  if (!("hoje" in d) && !("proximos" in d)) {
    $("card-hoje").hidden = true;
    $("card-prox").hidden = true;
  } else {
    const hoje = d.hoje || [];
    $("hoje").innerHTML = hoje.length
      ? hoje.map((e) => '<li' + (e.hora ? ' data-ini="' + esc(e.hora) + '" data-fim="' + esc(e.fim || "") + '"' : '') + '>' +
          '<span class="when">' + (e.hora ? esc(e.hora) + (e.fim ? '<small>até ' + esc(e.fim) + '</small>' : "") : '<small>Dia todo</small>') + '</span>' +
          '<span class="what">' + esc(e.titulo) + (e.local ? '<span class="where">' + esc(e.local) + '</span>' : "") + '</span></li>').join("")
      : '<li><span class="empty">Nenhum compromisso hoje.</span></li>';
    const prox = d.proximos || [];
    $("proximos").innerHTML = prox.length
      ? prox.map((e) => '<li><span class="when">' + esc(e.dia) + '<small>' + esc(e.hora || "dia todo") + '</small></span>' +
          '<span class="what">' + esc(e.titulo) + (e.local ? '<span class="where">' + esc(e.local) + '</span>' : "") + '</span></li>').join("")
      : '<li><span class="empty">Nada nos próximos 7 dias.</span></li>';
  }

  // ---------------------------------------------------------------- trânsito
  const t = d.transito;
  if (t) {
    // Compatibilidade com dados antigos (sem a lista "rotas")
    const rotas = (t.rotas && t.rotas.length) ? t.rotas : [
      { nome: t.rota, tempo: t.tempo, distancia: t.distancia, nota: t.observacao || "", melhor: true },
      ...(t.alternativas || []).map((x) => ({ nome: x.rota, tempo: x.tempo, distancia: x.distancia, nota: "" })),
    ];
    const comMapa = !!window.L && rotas.some((r) => (r.coords || []).length > 1);
    const st = ["normal", "atencao", "lento", "semdados"].includes(t.status) ? t.status : "semdados";
    const stTxt = { normal: "Fluxo normal", atencao: "Atenção", lento: "Lento", semdados: "Sem trânsito ao vivo" }[st];
    $("trans-obs").textContent = t.observacao || "";
    const temTrafego = rotas.some((r) => (r.trafego || []).length);

    $("transito").outerHTML =
      '<div class="trip"><span class="route"><b>' + esc(t.origem) + '</b> → <b>' + esc(t.destino) + '</b></span>' +
        '<span class="pill ' + st + '">' + stTxt + '</span></div>' +
      (comMapa ? '<div class="map" id="map" role="img" aria-label="Mapa com as rotas de casa até o trabalho"></div>' : "") +
      (comMapa && temTrafego ? '<div class="legend"><span><i style="background:var(--r-best)"></i>Livre</span><span><i style="background:var(--r-slow)"></i>Lento</span><span><i style="background:var(--r-jam)"></i>Parado</span><span><i style="background:var(--r-alt)"></i>Alternativa</span></div>' : "") +
      '<ul class="routes">' + rotas.map((r) =>
        '<li class="' + (r.melhor ? "best" : "") + '"><i class="sw"></i>' +
        '<div class="nm"><b>' + esc(r.nome) + '</b><small' + (/lentid/.test(r.nota || "") ? ' class="slow"' : '') + '>' + esc(r.nota || "") + '</small></div>' +
        '<div class="tm"><strong>' + esc(r.tempo) + '</strong><small>' + esc(r.distancia || "") + '</small></div></li>').join("") +
      '</ul>' +
      ((t.alertas || []).length ? '<ul class="alerts">' + t.alertas.map((x) => '<li>' + esc(x) + '</li>').join("") + '</ul>' : "");

    if (comMapa) desenharMapa(t, rotas);
  }

  function desenharMapa(t, rotas) {
    const mapa = L.map("map", {
      zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
      boxZoom: false, keyboard: false, touchZoom: false, attributionControl: true, zoomSnap: 0.25,
    });
    mapa.attributionControl.setPrefix(false);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 19, attribution: "© OpenStreetMap © CARTO",
    }).addTo(mapa);

    const corVel = { SLOW: cor("--r-slow"), TRAFFIC_JAM: cor("--r-jam") };
    const limites = L.latLngBounds([]);
    const desenhaveis = rotas.filter((r) => (r.coords || []).length > 1);

    // Alternativas primeiro (embaixo), melhor rota por último (em cima)
    desenhaveis.filter((r) => !r.melhor).forEach((r) => {
      L.polyline(r.coords, { color: cor("--r-casing"), weight: 10, opacity: .9 }).addTo(mapa);
      L.polyline(r.coords, { color: cor("--r-alt"), weight: 6, opacity: .95 }).addTo(mapa);
      r.coords.forEach((p) => limites.extend(p));
    });
    desenhaveis.filter((r) => r.melhor).forEach((r) => {
      L.polyline(r.coords, { color: cor("--r-casing"), weight: 12 }).addTo(mapa);
      L.polyline(r.coords, { color: cor("--r-best"), weight: 7 }).addTo(mapa);
      (r.trafego || []).forEach(([a, b, vel]) => {
        const trecho = r.coords.slice(a, b + 1);
        if (trecho.length > 1) L.polyline(trecho, { color: corVel[vel] || cor("--r-best"), weight: 7 }).addTo(mapa);
      });
      r.coords.forEach((p) => limites.extend(p));
    });

    // Etiqueta de cada rota no ponto mais distante das outras rotas
    desenhaveis.forEach((r) => {
      const outras = desenhaveis.filter((o) => o !== r).flatMap((o) => o.coords.filter((_, i) => i % 3 === 0));
      const passo = Math.max(1, Math.floor(r.coords.length / 60));
      let melhorP = r.coords[Math.floor(r.coords.length / 2)], melhorD = -1;
      for (let i = Math.floor(r.coords.length * .15); i < r.coords.length * .85; i += passo) {
        const p = r.coords[i];
        let min = Infinity;
        for (const o of outras) { const dl = (p[0] - o[0]) ** 2 + (p[1] - o[1]) ** 2; if (dl < min) min = dl; }
        if (min > melhorD) { melhorD = min; melhorP = p; }
      }
      L.marker(melhorP, {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: "", iconSize: null, html: '<div class="rl' + (r.melhor ? " best" : "") + '"><b>' + esc(r.tempo) + '</b><span>' + esc(r.distancia || "") + '</span></div>' }),
      }).addTo(mapa);
    });

    if (t.pontoOrigem) {
      L.circleMarker(t.pontoOrigem, { radius: 8, color: "#ffffff", weight: 3, fillColor: cor("--r-best"), fillOpacity: 1 }).addTo(mapa);
      limites.extend(t.pontoOrigem);
    }
    if (t.pontoDestino) {
      L.circleMarker(t.pontoDestino, { radius: 9, color: "#ffffff", weight: 3, fillColor: cor("--r-jam"), fillOpacity: 1 }).addTo(mapa);
      limites.extend(t.pontoDestino);
    }
    const ajustar = () => { mapa.invalidateSize(); mapa.fitBounds(limites, { padding: [40, 40] }); };
    ajustar();
    window.addEventListener("resize", ajustar);
  }

  // ---------------------------------------------------------------- notícias
  const nomes = { economia: "Economia", politica: "Política", esportes: "Esportes" };
  const n = d.noticias || [];
  $("noticias").innerHTML = n.length
    ? n.map((x) => '<li><span class="tag ' + esc(x.categoria) + '">' + esc(nomes[x.categoria] || x.categoria) + '</span>' +
        '<p>' + esc(x.titulo) + (x.fonte ? '<span class="src">' + esc(x.fonte) + '</span>' : "") + '</p></li>').join("")
    : '<li><span class="empty">Sem manchetes no momento.</span></li>';

  tick();
  setInterval(tick, 15000);

  async function manterAcesa() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  manterAcesa();
  document.addEventListener("visibilitychange", manterAcesa);
})();
</script>
</body>
</html>
